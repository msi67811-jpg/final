<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>메이크업 사진 평가</title>
<style>
:root{--plum:#6D2E46;--soft:#F6EEF1;--line:#E7D6DD;--ink:#2B1F24;--mute:#8A7F84}
*{box-sizing:border-box}body{margin:0;background:#FCF8FA;color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:24px 16px}
h1{color:var(--plum);font-size:22px;margin:0 0 8px}p{line-height:1.6;margin:6px 0}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:14px}
input[type=text]{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:15px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#fff;padding:12px;flex:1;font-size:15px;min-width:64px}
button.sel{background:var(--plum);color:#fff;border-color:var(--plum)}button.go{background:var(--plum);color:#fff;border:0}
button:disabled{opacity:.4;cursor:default}img{width:100%;border-radius:10px;display:block;background:#eee}
.q{font-weight:700;margin-top:16px}.q small{font-weight:400;color:var(--mute)}.mute{color:var(--mute);font-size:13px}.bar{height:6px;background:var(--soft);border-radius:3px;margin:10px 0}
.bar i{display:block;height:100%;background:var(--plum);border-radius:3px}.scale button{padding:10px 0}
.hint{display:flex;justify-content:space-between;color:var(--mute);font-size:12px;margin-top:4px}
textarea{width:100%;height:120px;font:12px/1.4 Consolas,monospace;border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:10px}
.ok{color:#2E7D4F;font-size:14px;min-height:20px;margin-top:6px}
</style></head><body><div class="wrap" id="app"></div>
<script>
const CFG=/*CFG*/null;
const ITEMS=/*ITEMS*/[];
const REASONS=['색','경계(번짐·모양)','질감·광택'];
const app=document.getElementById('app');let rater='',seq=[],i=0,ans=[],cur={},t0=0;
const $=id=>document.getElementById(id);
function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function pick(){ // 서로 다른 사람 per명: 쌍 사진 np명(실제·AR 반반) + 4부위 AR nf명(약·중·강 고루)
  const has=k=>[...new Set(ITEMS.filter(x=>x.k===k).map(x=>x.g))];
  const per=CFG.per,nf=Math.min(CFG.full||0,has('F').length),np=per-nf;
  const pg=shuffle(has('L')).slice(0,np);
  const fg=shuffle(has('F').filter(g=>!pg.includes(g))).slice(0,nf);
  const side=shuffle([...Array(pg.length).keys()].map(k=>k<Math.ceil(pg.length/2)?0:1));
  const lv=shuffle([...Array(fg.length).keys()].map(k=>k<3?k:Math.floor(Math.random()*3)));
  return shuffle(pg.map((g,k)=>ITEMS.find(x=>x.k==='L'&&x.g===g&&(x.v+x.g)%2===side[k]))
    .concat(fg.map((g,k)=>ITEMS.find(x=>x.k==='F'&&x.g===g&&(x.v+x.g)%3===lv[k]))))}
function start(){document.title=CFG.title;app.innerHTML=`<h1>${CFG.title}</h1>
<p>얼굴 사진 <b>${CFG.per}장</b>을 한 장씩 보여 드립니다. 일부는 <b>실제로 화장한 사진</b>, 일부는 <b>앱이 화장을 합성한 사진(AR)</b>입니다.</p>
<p>장마다 ① 실제인지 AR인지 ② 얼마나 자연스러운지(1~5점) ③ 어색해 보이는 곳이 있는지 골라 주세요. 약 3분 걸립니다.</p>
<div class="card"><p class="q">이름 (또는 별명)</p><input type="text" id="nm" placeholder="예: 평가자1">
<div class="row"><button class="go" id="go" disabled>시작</button></div></div>
<p class="mute">이 파일은 인터넷에 연결하지 않습니다. 사진은 팀 내부 연구 평가에만 쓰며, 다른 곳에 올리거나 저장하지 말아 주세요.</p>`;
$('nm').oninput=()=>{$('go').disabled=!$('nm').value.trim()};
$('go').onclick=()=>{rater=$('nm').value.trim();seq=pick();i=0;ans=[];show()}}
function show(){if(i>=seq.length)return done();const it=seq[i];cur={real:null,score:null,parts:new Set(),reasons:new Set()};t0=performance.now();
app.innerHTML=`<p class="mute">${i+1} / ${seq.length}</p><div class="bar"><i style="width:${i/seq.length*100}%"></i></div>
<img src="${it.src}" alt="얼굴 사진 ${i+1}">
<p class="q">① 이 사진은?</p><div class="row"><button id="r1">실제 화장</button><button id="r0">AR (앱 합성)</button></div>
<p class="q">② 얼마나 자연스러운가요?</p><div class="row scale">${[1,2,3,4,5].map(n=>`<button id="c${n}">${n}</button>`).join('')}</div>
<div class="hint"><span>1 얼굴에서 붕 뜸</span><span>5 실제 화장처럼 보임</span></div>
<p class="q">③ 어색해 보이는 부위 <small>(여러 개 가능)</small></p><div class="row">${CFG.parts.map((p,k)=>`<button id="p${k}">${p}</button>`).join('')}<button id="pn">없음</button></div>
<div id="rs" style="display:none"><p class="q">어색한 이유 <small>(여러 개 가능)</small></p><div class="row">${REASONS.map((p,k)=>`<button id="w${k}">${p}</button>`).join('')}</div></div>
<div class="row"><button class="go" id="nx" disabled>다음</button></div>`;
const upd=()=>{$('r1').classList.toggle('sel',cur.real===1);$('r0').classList.toggle('sel',cur.real===0);
 for(let n=1;n<=5;n++)$('c'+n).classList.toggle('sel',cur.score===n);
 CFG.parts.forEach((p,k)=>$('p'+k).classList.toggle('sel',cur.parts.has(p)));$('pn').classList.toggle('sel',cur.parts.has('없음'));
 REASONS.forEach((p,k)=>$('w'+k).classList.toggle('sel',cur.reasons.has(p)));
 const any=cur.parts.size&&!cur.parts.has('없음');$('rs').style.display=any?'block':'none';if(!any)cur.reasons.clear();
 $('nx').disabled=cur.real===null||cur.score===null||!cur.parts.size||(any&&!cur.reasons.size)};
$('r1').onclick=()=>{cur.real=1;upd()};$('r0').onclick=()=>{cur.real=0;upd()};
for(let n=1;n<=5;n++)$('c'+n).onclick=()=>{cur.score=n;upd()};
CFG.parts.forEach((p,k)=>$('p'+k).onclick=()=>{cur.parts.delete('없음');cur.parts.has(p)?cur.parts.delete(p):cur.parts.add(p);upd()});
$('pn').onclick=()=>{cur.parts=new Set(['없음']);upd()};
REASONS.forEach((p,k)=>$('w'+k).onclick=()=>{cur.reasons.has(p)?cur.reasons.delete(p):cur.reasons.add(p);upd()});
$('nx').onclick=()=>{ans.push({id:it.id,answer:cur.real?'REAL':'AR',score:cur.score,parts:[...cur.parts].join('|'),reasons:[...cur.reasons].join('|'),ms:Math.round(performance.now()-t0)});i++;show()}}
function csv(){const rows=[['rater','order','image_id','answer','score','parts','reasons','ms']];ans.forEach((a,k)=>rows.push([rater,k+1,a.id,a.answer,a.score,a.parts,a.reasons,a.ms]));
return rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n')}
function fname(){return `naturalness_${rater.replace(/[^\w가-힣-]/g,'_')}.csv`}
function save(){const b=new Blob(['﻿'+csv()],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fname();document.body.appendChild(a);a.click();a.remove();$('msg').textContent=`다운로드 폴더에 ${fname()} 로 저장했습니다.`}
async function copy(){const t=csv();try{await navigator.clipboard.writeText(t)}catch(e){const ta=$('txt');ta.focus();ta.select();document.execCommand('copy')}
 $('msg').textContent='복사했습니다. 디스코드 대화창에 붙여넣기(Ctrl+V) 해서 보내 주세요.'}
function done(){app.innerHTML=`<h1>끝났습니다. 감사합니다!</h1><p>아래 둘 중 <b>편한 방법 하나</b>로 결과를 평가를 요청한 사람에게 보내 주세요.</p>
<div class="card"><p class="q">방법 1. 복사해서 붙여넣기</p><p class="mute">버튼을 누른 뒤 디스코드 대화창에 Ctrl+V 하면 됩니다.</p><div class="row"><button class="go" id="cp">결과 복사</button></div>
<p class="q">방법 2. 파일로 보내기</p><p class="mute">다운로드 폴더에 CSV 파일이 저장됩니다. 그 파일을 첨부해 보내 주세요.</p><div class="row"><button id="sv">결과 CSV 저장</button></div>
<div class="ok" id="msg"></div><textarea id="txt" readonly></textarea></div>
<p class="mute">정답은 결과에 들어 있지 않습니다. 이 창을 닫기 전에 꼭 보내 주세요.</p>`;
$('txt').value=csv();$('cp').onclick=copy;$('sv').onclick=save}
start();
</script></body></html>

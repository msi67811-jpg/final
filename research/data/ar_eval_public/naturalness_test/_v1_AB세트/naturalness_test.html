:root{--plum:#6D2E46;--soft:#F6EEF1;--line:#E7D6DD;--ink:#2B1F24;--mute:#8A7F84}

.hint{display:flex;justify-content:space-between;color:var(--mute);font-size:12px;margin-top:4px}

<p>입술 사진 <b>20장</b>을 한 장씩 보여 드립니다. 일부는 <b>실제로 바른 립</b>, 일부는 <b>앱이 합성한 립(AR)</b>입니다.</p>
<p>장마다 ① 진짜인지 AR인지 고르고 ② 얼마나 자연스러운지 1~5점을 눌러 주세요. 한 장에 10초 정도면 충분합니다. 약 4분 걸립니다.</p>
<div class="card"><p class="q">이름 (또는 별명)</p><input type="text" id="nm" placeholder="예: 평가자1">
<p class="q">세트 (안내받은 세트를 고르세요)</p><div class="row"><button id="sA">A 세트</button><button id="sB">B 세트</button></div>
<div class="row"><button class="go" id="go" disabled>시작</button></div></div>
<p class="mute">이 파일은 인터넷에 연결하지 않습니다. 결과는 마지막에 CSV 파일로 저장되며, 사진은 팀 내부 연구 평가에만 씁니다.</p>`;
const chk=()=>{document.getElementById('go').disabled=!(document.getElementById('nm').value.trim()&&set)};
document.getElementById('nm').oninput=chk;
for(const s of ['A','B'])document.getElementById('s'+s).onclick=()=>{set=s;document.getElementById('sA').classList.toggle('sel',s==='A');document.getElementById('sB').classList.toggle('sel',s==='B');chk()};
document.getElementById('go').onclick=()=>{rater=document.getElementById('nm').value.trim();seq=ITEMS.filter(x=>x.set===set);for(let k=seq.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[seq[k],seq[j]]=[seq[j],seq[k]]}i=0;ans=[];show()}}
function show(){if(i>=seq.length)return done();const it=seq[i];cur={real:null,score:null};t0=performance.now();
app.innerHTML=`<p class="mute">${i+1} / ${seq.length}</p><div class="bar"><i style="width:${i/seq.length*100}%"></i></div>
<img src="${it.src}" alt="입술 사진 ${i+1}"><p class="q">① 이 립은?</p><div class="row"><button id="r1">실제로 바른 립</button><button id="r0">AR (앱 합성)</button></div>
<p class="q">② 얼마나 자연스러운가요?</p><div class="scale">${[1,2,3,4,5].map(n=>`<button id="c${n}">${n}</button>`).join('')}</div>
<div class="hint"><span>1 얼굴에서 붕 뜸</span><span>5 실제 화장처럼 보임</span></div>
<div class="row"><button class="go" id="nx" disabled>다음</button></div>`;
const upd=()=>{document.getElementById('r1').classList.toggle('sel',cur.real===1);document.getElementById('r0').classList.toggle('sel',cur.real===0);
for(let n=1;n<=5;n++)document.getElementById('c'+n).classList.toggle('sel',cur.score===n);document.getElementById('nx').disabled=cur.real===null||cur.score===null};
document.getElementById('r1').onclick=()=>{cur.real=1;upd()};document.getElementById('r0').onclick=()=>{cur.real=0;upd()};
for(let n=1;n<=5;n++)document.getElementById('c'+n).onclick=()=>{cur.score=n;upd()};
document.getElementById('nx').onclick=()=>{ans.push({id:it.id,answer:cur.real?'REAL':'AR',score:cur.score,ms:Math.round(performance.now()-t0)});i++;show()}}
function csv(){const rows=[['rater','set','order','image_id','answer','score','ms']];ans.forEach((a,k)=>rows.push([rater,set,k+1,a.id,a.answer,a.score,a.ms]));
return '\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n')}
function save(){const b=new Blob([csv()],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`naturalness_${rater.replace(/[^\w가-힣-]/g,'_')}_${set}.csv`;document.body.appendChild(a);a.click();a.remove()}
function done(){app.innerHTML=`<h1>끝났습니다. 감사합니다!</h1><p>아래 버튼으로 결과 파일을 저장한 뒤, 평가를 요청한 사람에게 보내 주세요.</p>
<div class="row"><button class="go" id="sv">결과 CSV 저장</button></div><p class="mute">정답은 이 파일에 들어 있지 않습니다. 결과는 따로 계산합니다.</p>`;
document.getElementById('sv').onclick=save;save()}
start();
</script></body></html>
